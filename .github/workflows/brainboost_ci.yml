name: BrainBoost CI Workflow
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install GDScript Toolkit
        run: pip3 install gdtoolkit

      - name: Run GDLint (Code Formatting Check)
        run: gdlint brain-boost/Sudoku.gd brain-boost/WordStack.gd

      - name: Final Validation
        run: echo "All automated checks passed for the BrainBoost team!"
